# Builds the app on GitHub's macOS runner when a version tag (v0.3.0 …) is pushed, and puts it on a *draft* Release:
# the maintainer downloads it, tries it and publishes the Release by hand.
# - Built from the tagged commit only: nothing from the maintainer's Mac (debug recordings, keys, local files) can end
#   up in the download.
# - One secret: the release signing certificate (SIGN_P12_BASE64 + SIGN_P12_PASSWORD, a self-signed code-signing
#   certificate). Every release is signed with the same certificate, so macOS keeps the screen-recording permission
#   across updates. It is only used in the build step, through a throwaway keychain. Third-party actions are pinned to
#   commit hashes.
# - The DMG gets a SHA-256 checksum and a build provenance attestation
#   (`gh attestation verify <dmg> --repo <owner>/<repo>` proves it was built here from this commit).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.3.0)
        required: true

permissions:
  contents: write      # create the draft Release
  id-token: write      # build provenance attestation
  attestations: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0          # build number = commit count
          persist-credentials: false

      - name: Tag matches VERSION
        run: |
          v="v$(cat VERSION)"
          if [ "$v" != "$TAG" ]; then echo "VERSION says $v but the tag is $TAG"; exit 1; fi

      - name: Privacy check (keys, paths, commit authors)
        run: ./scripts/privacy-check.sh

      - name: Build, package and sign
        env:
          SIGN_P12_BASE64: ${{ secrets.SIGN_P12_BASE64 }}
          SIGN_P12_PASSWORD: ${{ secrets.SIGN_P12_PASSWORD }}
          # SHA-1 of the release certificate: a release signed with anything else fails here.
          RELEASE_CERT_SHA1: 6619c5e8a5f7a847ed2fbec40b085d865c7e8e00
        run: |
          if [ -z "$SIGN_P12_BASE64" ]; then echo "缺少签名证书 secret（SIGN_P12_BASE64）"; exit 1; fi
          export SIGN_P12="$RUNNER_TEMP/signing.p12"
          (umask 077; printf '%s' "$SIGN_P12_BASE64" | base64 --decode > "$SIGN_P12")
          ./scripts/build-app.sh
          rm -f "$SIGN_P12"
          codesign --verify --deep --strict "dist/卫戍协议小助手.app"
          codesign -dr - "dist/卫戍协议小助手.app" 2>&1 | tee req.txt
          grep -q "certificate root = H\"$RELEASE_CERT_SHA1\"" req.txt

      - name: Self-tests that need no recordings
        run: |
          BIN=".build/apple/Products/Release/GarrisonHelper"
          [ -x "$BIN" ] || BIN=".build/release/GarrisonHelper"
          "$BIN" --trackertest | tee tracker.txt
          grep -q "board first, report late (want 0 1 1 1 1): 0 1 1 1 1" tracker.txt
          "$BIN" --plan "" "" | grep -q "^candidates: "
          strings -a "dist/卫戍协议小助手.app/Contents/MacOS/GarrisonHelper" | grep -i -E "/Users/[a-z]" && exit 1 || true

      - name: DMG and checksum
        run: |
          # Disk image with the app and an Applications shortcut: open it, drag the app across.
          DMG="GarrisonHelperMac-$TAG.dmg"
          mkdir -p dmg && cp -R "dist/卫戍协议小助手.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "卫戍协议小助手 $TAG" -srcfolder dmg -fs HFS+ -format UDZO -ov "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "PKG=$DMG" >> "$GITHUB_ENV"

      # GitHub only stores attestations for public repositories (and organisation plans); a private user repository
      # skips this step.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: ${{ env.PKG }}

      - name: Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          # Release notes in immich's style (scripts/release-notes.sh): the CHANGELOG section (intro + grouped changes),
          # every commit with its author and link grouped by kind, 新贡献者, install / verify notes, full comparison.
          ./scripts/release-notes.sh "$TAG" "${{ github.repository }}" "$PRIVATE" > notes.md
          cat notes.md
          gh release create "$TAG" --draft --verify-tag --title "卫戍协议小助手 $TAG" --notes-file notes.md "$PKG" SHA256SUMS.txt
